<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мониторинг Смен КЦ</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(17, 25, 40, 0.65);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-secondary: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-purple: #8b5cf6;
            --accent-yellow: #f59e0b;
        }

        :root[data-theme="light"] {
            --bg-color: #f1f5f9;
            --card-bg: rgba(255, 255, 255, 0.7);
            --card-border: rgba(0, 0, 0, 0.08);
            --text-main: #0f172a;
            --text-secondary: #64748b;
            --accent-blue: #2563eb;
            --accent-green: #059669;
            --accent-purple: #7c3aed;
            --accent-yellow: #d97706;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.12) 0, transparent 40%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.12) 0, transparent 40%);
            background-attachment: fixed;
            padding: 2rem;
            transition: background-color 0.3s, color 0.3s;
        }

        :root[data-theme="light"] body {
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.08) 0, transparent 40%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.08) 0, transparent 40%);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding: 1.5rem;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: background-color 0.3s, border-color 0.3s;
        }

        .logo-section h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.25rem;
        }

        .logo-section p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .stats-section {
            display: flex;
            gap: 1.5rem;
        }

        .stat-badge {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            padding: 0.75rem 1.25rem;
            border-radius: 12px;
            text-align: center;
            transition: background-color 0.3s, border-color 0.3s;
        }

        :root[data-theme="light"] .stat-badge {
            background: rgba(0, 0, 0, 0.02);
        }

        .stat-val {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--accent-blue);
        }

        .stat-val.green { color: var(--accent-green); }
        .stat-val.purple { color: var(--accent-purple); }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 0.2rem;
        }

        /* Sync Status indicator */
        .sync-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .spinner {
            width: 8px;
            height: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.8s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0.8); opacity: 0.5; }
        }

        /* Grid - align-items: start fixes card height stretching */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
            align-items: start;
        }

        .dept-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1.5rem;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s, background-color 0.3s, border-color 0.3s;
        }

        .dept-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .dept-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .dept-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .dept-badge {
            background: rgba(59, 130, 246, 0.15);
            color: var(--accent-blue);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .empty-state {
            color: var(--text-secondary);
            font-style: italic;
            font-size: 0.9rem;
            padding: 1rem 0;
            text-align: center;
        }

        /* Employee card list */
        .emp-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .emp-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 1rem;
            transition: background-color 0.3s, border-color 0.3s;
        }

        :root[data-theme="light"] .emp-item {
            background: rgba(0, 0, 0, 0.015);
            border-color: rgba(0, 0, 0, 0.025);
        }

        .emp-info {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.5rem;
        }

        .emp-name {
            font-weight: 500;
            font-size: 0.95rem;
            color: var(--text-main);
        }

        .emp-meta {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 0.2rem;
            display: flex;
            gap: 0.5rem;
        }

        .emp-meta-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
        }

        .emp-time {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--accent-green);
            text-align: right;
        }

        .emp-time.dop {
            color: var(--accent-yellow);
        }

        /* Badges */
        .dop-badge {
            background: rgba(245, 158, 11, 0.15);
            color: var(--accent-yellow);
            font-size: 0.75rem;
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            font-weight: 500;
            display: inline-block;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 2px;
            margin-top: 0.75rem;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-green));
            border-radius: 2px;
            width: 0%;
            transition: width 1s ease-in-out;
        }

        /* Tags for competencies */
        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
            margin-top: 0.6rem;
        }

        .tag {
            font-size: 0.7rem;
            background: rgba(139, 92, 246, 0.1);
            color: #a78bfa;
            border: 1px solid rgba(139, 92, 246, 0.2);
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
        }

        /* Loading View */
        .loading-view {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        /* Collapsible Departments & Views */
        .dept-header {
            cursor: pointer;
            user-select: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.3s ease;
        }

        .dept-card.expanded .dept-header {
            margin-bottom: 1.25rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .dept-header-left {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .chevron-icon {
            width: 20px;
            height: 20px;
            color: var(--text-secondary);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .dept-card.expanded .chevron-icon {
            transform: rotate(180deg);
            color: var(--accent-blue);
        }

        /* Employee list container is always visible now */
        .emp-list-container {
            opacity: 1;
            overflow: visible;
            transition: all 0.3s ease-in-out;
        }

        /* Compact Employee Card when dept is NOT expanded */
        .dept-card:not(.expanded) .emp-list {
            gap: 0.5rem;
        }

        .dept-card:not(.expanded) .emp-item {
            padding: 0.5rem 0.75rem;
            background: rgba(255, 255, 255, 0.015);
            border-color: rgba(255, 255, 255, 0.02);
        }

        .dept-card:not(.expanded) .emp-info {
            margin-bottom: 0.25rem;
            align-items: center;
        }

        .dept-card:not(.expanded) .emp-meta {
            display: none !important;
        }

        .dept-card:not(.expanded) .tags-container {
            display: none !important;
        }

        .dept-card:not(.expanded) .emp-time div:last-child {
            display: none !important;
        }

        .dept-card:not(.expanded) .progress-container {
            margin-top: 0.35rem;
        }

        /* Action buttons for header */
        .header-actions {
            display: flex;
            gap: 0.75rem;
            align-items: center;
            margin-right: 1.5rem;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--card-border);
            color: var(--text-secondary);
            padding: 0.5rem 0.85rem;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            border-color: rgba(255, 255, 255, 0.15);
        }

        /* Filter Bar and Chips (Custom Scrollbar) */
        .filter-bar {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 2rem;
            overflow-x: auto;
            padding: 0.5rem 0.25rem 0.75rem 0.25rem;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
        }

        .filter-bar::-webkit-scrollbar {
            height: 6px;
            display: block;
        }

        .filter-bar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 3px;
        }

        .filter-bar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
            transition: background-color 0.2s;
        }

        .filter-bar::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .filter-chip {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            color: var(--text-secondary);
            padding: 0.5rem 1.25rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .filter-chip:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-1px);
        }

        .filter-chip.active {
            background: rgba(59, 130, 246, 0.15);
            color: var(--accent-blue);
            border-color: var(--accent-blue);
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.25);
        }

        @media (max-width: 900px) {
            header {
                flex-direction: column;
                gap: 1.25rem;
                align-items: stretch;
                text-align: center;
            }
            .header-right {
                flex-direction: column;
                gap: 1rem;
            }
            .header-actions {
                margin-right: 0;
                justify-content: center;
            }
            .stats-section {
                justify-content: center;
            }
        }

        @media (max-width: 768px) {
            body { padding: 1rem; }
            .grid-container { grid-template-columns: 1fr; }
        }

        /* Clickable Badge */
        .stat-badge.clickable {
            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s, border-color 0.2s;
        }
        .stat-badge.clickable:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
            border-color: rgba(139, 92, 246, 0.3);
        }
        .stat-badge.clickable:active {
            transform: translateY(0);
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 15, 25, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-card {
            background: rgba(17, 25, 40, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 700;
            background: linear-gradient(135deg, #f59e0b, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1.8rem;
            line-height: 1;
            padding: 0.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: var(--text-main);
        }

        .modal-body {
            padding: 1.5rem;
            overflow-y: auto;
            flex-grow: 1;
        }

        /* Scrollbar for modal body */
        .modal-body::-webkit-scrollbar {
            width: 6px;
        }
        .modal-body::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.01);
        }
        .modal-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
        }
        .modal-body::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .dop-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .dop-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .dop-item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .dop-item-name {
            font-weight: 600;
            font-size: 1.05rem;
            color: #ffffff;
        }

        .dop-item-dept {
            font-size: 0.8rem;
            color: var(--accent-purple);
            background: rgba(139, 92, 246, 0.15);
            padding: 0.15rem 0.5rem;
            border-radius: 20px;
            display: inline-block;
            margin-top: 0.25rem;
        }

        .dop-item-meta {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .dop-item-time {
            text-align: right;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--accent-yellow);
        }

        .dop-item-progress-container {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 0.5rem;
        }

        .dop-item-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-yellow), #ec4899);
            border-radius: 2px;
        }

        /* Light Theme Overrides */
        :root[data-theme="light"] .tag {
            background: rgba(124, 58, 237, 0.06);
            color: var(--accent-purple);
            border-color: rgba(124, 58, 237, 0.15);
        }
        :root[data-theme="light"] .emp-meta-item {
            background: rgba(0, 0, 0, 0.04);
        }
        :root[data-theme="light"] .modal-card {
            background: rgba(255, 255, 255, 0.9);
            border-color: rgba(0, 0, 0, 0.1);
            color: var(--text-main);
        }
        :root[data-theme="light"] .dop-item {
            background: rgba(0, 0, 0, 0.01);
            border-color: rgba(0, 0, 0, 0.025);
        }
        :root[data-theme="light"] .dop-item-name {
            color: var(--text-main);
        }
        :root[data-theme="light"] .action-btn {
            background: rgba(0, 0, 0, 0.02);
            border-color: rgba(0, 0, 0, 0.08);
            color: var(--text-secondary);
        }
        :root[data-theme="light"] .action-btn:hover {
            background: rgba(0, 0, 0, 0.05);
            color: var(--text-main);
            border-color: rgba(0, 0, 0, 0.15);
        }

        /* Theme Switcher */
        .theme-toggle-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            width: 40px;
            height: 40px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 0;
            outline: none;
            flex-shrink: 0;
        }

        .theme-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
            transform: scale(1.05);
        }

        .theme-toggle-btn:active {
            transform: scale(0.95);
        }

        .theme-icon {
            width: 20px;
            height: 20px;
            color: var(--text-main);
        }

        :root[data-theme="light"] .theme-toggle-btn {
            background: rgba(0, 0, 0, 0.02);
            border-color: rgba(0, 0, 0, 0.08);
        }

        :root[data-theme="light"] .theme-toggle-btn:hover {
            background: rgba(0, 0, 0, 0.05);
            border-color: rgba(0, 0, 0, 0.15);
        }

        /* Icons visibility based on theme */
        :root[data-theme="light"] .theme-icon.sun {
            display: none !important;
        }
        :root[data-theme="light"] .theme-icon.moon {
            display: block !important;
        }
        :root:not([data-theme="light"]) .theme-icon.sun {
            display: block !important;
        }
        :root:not([data-theme="light"]) .theme-icon.moon {
            display: none !important;
        }

        /* Filter Controls Row (Search + Filter Chips) */
        .filter-controls-row {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 2rem;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 0.5rem 1rem;
            border-radius: 16px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all 0.3s ease;
        }

        .search-box {
            position: relative;
            display: flex;
            align-items: center;
            width: 280px;
            flex-shrink: 0;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            color: var(--text-secondary);
            pointer-events: none;
            width: 16px;
            height: 16px;
        }

        .search-box input {
            width: 100%;
            padding: 0.55rem 0.75rem 0.55rem 2.25rem;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.85rem;
            transition: all 0.25s ease;
        }

        .search-box input::placeholder {
            color: var(--text-secondary);
            opacity: 0.8;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--accent-blue);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.15);
        }

        :root[data-theme="light"] .search-box input {
            background: rgba(0, 0, 0, 0.015);
            border-color: rgba(0, 0, 0, 0.08);
        }

        :root[data-theme="light"] .search-box input:focus {
            background: rgba(255, 255, 255, 0.8);
            border-color: var(--accent-blue);
        }

        .filter-bar {
            flex-grow: 1;
            margin-bottom: 0 !important;
            padding-bottom: 0.25rem;
        }

        @media (max-width: 768px) {
            .filter-controls-row {
                flex-direction: column;
                align-items: stretch;
                gap: 1rem;
                padding: 1rem;
            }
            .search-box {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-section">
            <h1>Мониторинг Смен КЦ</h1>
            <div class="sync-indicator">
                <span class="spinner"></span>
                <span>Онлайн-график • Время МСК: <span id="msk-time-val">--:--</span></span>
            </div>
        </div>
        <div class="header-right" style="display: flex; align-items: center; flex-wrap: wrap; gap: 1rem;">
            <div class="header-actions">
                <button class="action-btn" onclick="expandAll()">Развернуть все</button>
                <button class="action-btn" onclick="collapseAll()">Свернуть все</button>
            </div>
            <button class="theme-toggle-btn" onclick="toggleTheme()" aria-label="Переключить тему">
                <svg class="theme-icon sun" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <svg class="theme-icon moon" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
            <div class="stats-section">
                <div class="stat-badge">
                    <div class="stat-val" id="total-online-val">--</div>
                    <div class="stat-label">На смене</div>
                </div>
                <div class="stat-badge clickable" onclick="showDopsModal()">
                    <div class="stat-val purple" id="total-dops-val">--</div>
                    <div class="stat-label">Усиление (Допы)</div>
                </div>
            </div>
        </div>
    </header>

    <div class="filter-controls-row">
        <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="search-input" placeholder="Поиск сотрудника или отдела..." oninput="handleSearch()">
        </div>
        <div class="filter-bar" id="filter-bar">
            <!-- Filter chips will be dynamically loaded here -->
        </div>
    </div>

    <div class="grid-container" id="grid-root">
        <div class="loading-view">Загрузка данных мониторинга...</div>
    </div>

    <!-- Dops Modal Popup -->
    <div id="dops-modal" class="modal-overlay" onclick="closeDopsModal(event)">
        <div class="modal-card" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h2 class="modal-title">Сотрудники на усилении (Допы)</h2>
                <button class="close-btn" onclick="closeDopsModal(event)">&times;</button>
            </div>
            <div class="modal-body" id="dops-modal-body">
                <!-- Will be dynamically populated -->
            </div>
        </div>
    </div>

    <script>
        // Theme Toggle Logic (inline script to avoid flash of dark mode)
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();

        const API_URL = 'https://pkpvsdqvpqpqvlneevud.supabase.co/functions/v1/public-dashboard?format=json';

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }

        function handleSearch() {
            if (!globalData) return;
            const gridRoot = document.getElementById('grid-root');
            gridRoot.innerHTML = renderDepts(globalData.departments, globalData.currentMins);
        }
        
        let expandedDepts = new Set();
        let isInitialLoad = true;
        let globalData = null;
        let selectedFilter = 'all';

        // Update function called every 60 seconds
        async function refreshData() {
            const spinner = document.querySelector('.spinner');
            if (spinner) spinner.style.backgroundColor = '#f59e0b'; // Amber color while fetching

            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                
                // Store globally
                globalData = data;

                // 1. Update headers
                document.getElementById('msk-time-val').textContent = data.mskTimeStr;
                document.getElementById('total-online-val').textContent = data.totalOnline;
                document.getElementById('total-dops-val').textContent = data.totalDops;

                // 2. Setup initial expansion (departments start collapsed by default for compact view)
                if (isInitialLoad && data.departments) {
                    isInitialLoad = false;
                }

                // 3. Render filter chips
                renderFilterChips(data.departments);

                // 4. Re-render Grid
                const gridRoot = document.getElementById('grid-root');
                gridRoot.innerHTML = renderDepts(data.departments, data.currentMins);

                if (spinner) spinner.style.backgroundColor = '#10b981'; // Green on success
            } catch (e) {
                console.error("Fetch failed:", e);
                if (spinner) spinner.style.backgroundColor = '#ef4444'; // Red on error
            }
        }

        // Toggle department expansion
        function toggleDept(deptId) {
            const card = document.getElementById(`card-${deptId}`);
            if (!card) return;

            if (expandedDepts.has(deptId)) {
                expandedDepts.delete(deptId);
                card.classList.remove('expanded');
            } else {
                expandedDepts.add(deptId);
                card.classList.add('expanded');
            }
        }

        // Expand all departments
        function expandAll() {
            const cards = document.querySelectorAll('.dept-card');
            cards.forEach(card => {
                const id = card.id.replace('card-', '');
                expandedDepts.add(id);
                card.classList.add('expanded');
            });
        }

        // Collapse all departments
        function collapseAll() {
            const cards = document.querySelectorAll('.dept-card');
            cards.forEach(card => {
                const id = card.id.replace('card-', '');
                expandedDepts.delete(id);
                card.classList.remove('expanded');
            });
        }

        // Render system booking filter chips
        function renderFilterChips(departments) {
            const activeCompetencies = new Set();
            departments.forEach(d => {
                d.employees.forEach(e => {
                    e.competencies.forEach(c => activeCompetencies.add(c));
                });
            });

            const sortedCompetencies = Array.from(activeCompetencies).sort();
            const filterBar = document.getElementById('filter-bar');
            if (!filterBar) return;

            let html = `<button class="filter-chip ${selectedFilter === 'all' ? 'active' : ''}" data-filter="all" onclick="selectFilter('all')">Все системы</button>`;
            
            sortedCompetencies.forEach(c => {
                html += `<button class="filter-chip ${selectedFilter === c ? 'active' : ''}" data-filter="${c}" onclick="selectFilter('${c}')">${c}</button>`;
            });

            filterBar.innerHTML = html;
        }

        // Select a booking system filter
        function selectFilter(comp) {
            selectedFilter = comp;
            
            // Update active class in chips
            const chips = document.querySelectorAll('.filter-chip');
            chips.forEach(chip => {
                if (chip.getAttribute('data-filter') === comp) {
                    chip.classList.add('active');
                } else {
                    chip.classList.remove('active');
                }
            });

            if (!globalData) return;

            // Re-render (expansion state is preserved)
            const gridRoot = document.getElementById('grid-root');
            gridRoot.innerHTML = renderDepts(globalData.departments, globalData.currentMins);
        }

        // JS client-side rendering helper for update
        function renderDepts(depts, currentMins) {
            let html = '';
            let renderedCount = 0;
            const searchInput = document.getElementById('search-input');
            const searchQ = (searchInput ? searchInput.value : '').toLowerCase().trim();

            for (const d of depts) {
                // Filter employees inside department by reservation system
                let filteredEmployees = selectedFilter === 'all'
                    ? d.employees
                    : d.employees.filter(e => e.competencies.includes(selectedFilter));

                // Filter by search query (match dept name or employee name/location)
                const deptMatches = d.name.toLowerCase().includes(searchQ);
                if (searchQ && !deptMatches) {
                    filteredEmployees = filteredEmployees.filter(e => 
                        e.name.toLowerCase().includes(searchQ) || 
                        e.location.toLowerCase().includes(searchQ)
                    );
                }

                // Skip department card if there are no matching employees in search mode
                if (searchQ && filteredEmployees.length === 0) {
                    continue;
                }

                renderedCount++;

                const employeesHtml = filteredEmployees.length > 0 
                    ? filteredEmployees.map(e => {
                        // Calculate shift progress percentage
                        let duration = e.endMins - e.startMins;
                        if (duration <= 0) duration += 1440;
                        let elapsed = currentMins - e.startMins;
                        if (elapsed < 0 && e.startMins > 1000) elapsed += 1440; // overnight boundary
                        let pct = Math.max(0, Math.min(100, Math.floor((elapsed / duration) * 100)));

                        // Calculate remaining time
                        let remMin = e.endMins - currentMins;
                        if (remMin < 0) remMin += 1440;
                        const remH = Math.floor(remMin / 60);
                        const remM = remMin % 60;
                        const timeText = remH > 0 ? `${remH}ч ${remM}м` : `${remM}м`;

                        const dopBadge = e.isDop ? '<span class="dop-badge">Доп</span>' : '';
                        const timeClass = e.isDop ? 'emp-time dop' : 'emp-time';

                        const tags = e.competencies.map(t => `<span class="tag">${t}</span>`).join('');

                        return `
                            <div class="emp-item">
                                <div class="emp-info">
                                    <div>
                                        <div class="emp-name">${e.name}</div>
                                        <div class="emp-meta">
                                            <span class="emp-meta-item">${e.location}</span>
                                            ${dopBadge}
                                        </div>
                                    </div>
                                    <div class="${timeClass}">
                                        <div>${e.startTime} - ${e.endTime}</div>
                                        <div style="font-size: 0.75rem; color: var(--text-secondary); margin-top: 0.15rem;">ост. ${timeText}</div>
                                    </div>
                                </div>
                                <div class="tags-container">${tags}</div>
                                <div class="progress-container">
                                    <div class="progress-bar" style="width: ${pct}%;"></div>
                                </div>
                            </div>
                        `;
                    }).join('')
                    : '<div class="empty-state">Нет сотрудников с выбранной квалификацией</div>';

                const isExpanded = expandedDepts.has(d.id);
                
                // Show filtered count versus total online count
                const countText = selectedFilter === 'all' && !searchQ
                    ? `${d.employees.length} онлайн`
                    : `${filteredEmployees.length} из ${d.employees.length}`;

                html += `
                    <div class="dept-card ${isExpanded ? 'expanded' : ''}" id="card-${d.id}">
                        <div class="dept-header" onclick="toggleDept('${d.id}')">
                            <div class="dept-header-left">
                                <svg class="chevron-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="6 9 12 15 18 9"></polyline>
                                </svg>
                                <span class="dept-title">${d.name}</span>
                            </div>
                            <span class="dept-badge">${countText}</span>
                        </div>
                        <div class="emp-list-container">
                            <div class="emp-list">${employeesHtml}</div>
                        </div>
                    </div>
                `;
            }
            if (renderedCount === 0) {
                return '<div class="empty-state" style="grid-column: 1 / -1; padding: 4rem 2rem; font-size: 1.15rem; text-align: center; color: var(--text-secondary);">Ничего не найдено по вашему запросу</div>';
            }
            return html;
        }

        // Modal window management for Dops
        function showDopsModal() {
            const modal = document.getElementById('dops-modal');
            const body = document.getElementById('dops-modal-body');
            if (!modal || !body || !globalData) return;

            const dops = [];
            globalData.departments.forEach(d => {
                d.employees.forEach(e => {
                    if (e.isDop) {
                        dops.push({
                            ...e,
                            deptName: d.name
                        });
                    }
                });
            });

            if (dops.length === 0) {
                body.innerHTML = '<div class="empty-state">Нет сотрудников на усилении (допах) в данный момент</div>';
            } else {
                body.innerHTML = `
                    <div class="dop-list">
                        ${dops.map(e => {
                            let duration = e.endMins - e.startMins;
                            if (duration <= 0) duration += 1440;
                            let elapsed = globalData.currentMins - e.startMins;
                            if (elapsed < 0 && e.startMins > 1000) elapsed += 1440;
                            let pct = Math.max(0, Math.min(100, Math.floor((elapsed / duration) * 100)));

                            let remMin = e.endMins - globalData.currentMins;
                            if (remMin < 0) remMin += 1440;
                            const remH = Math.floor(remMin / 60);
                            const remM = remMin % 60;
                            const timeText = remH > 0 ? `${remH}ч ${remM}м` : `${remM}м`;

                            const tags = e.competencies.map(t => `<span class="tag">${t}</span>`).join('');

                            return `
                                <div class="dop-item">
                                    <div class="dop-item-header">
                                        <div>
                                            <div class="dop-item-name">${e.name}</div>
                                            <div class="dop-item-dept">${e.deptName}</div>
                                        </div>
                                        <div class="dop-item-time">
                                            <div>${e.startTime} - ${e.endTime}</div>
                                            <div style="font-size: 0.75rem; color: var(--text-secondary); margin-top: 0.15rem;">ост. ${timeText}</div>
                                        </div>
                                    </div>
                                    <div class="dop-item-meta">
                                        <span class="emp-meta-item" style="background: rgba(255, 255, 255, 0.05); padding: 0.1rem 0.4rem; border-radius: 4px;">${e.location}</span>
                                    </div>
                                    <div class="tags-container">${tags}</div>
                                    <div class="dop-item-progress-container">
                                        <div class="dop-item-progress-bar" style="width: ${pct}%;"></div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
            }

            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeDopsModal(event) {
            const modal = document.getElementById('dops-modal');
            if (modal) {
                modal.classList.remove('active');
            }
            document.body.style.overflow = '';
        }

        // Close on ESC key
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeDopsModal();
            }
        });

        // Load initial data
        refreshData();

        // Set intervals
        setInterval(refreshData, 60000);
    </script>
</body>
</html>
